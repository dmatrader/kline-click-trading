<body>

    <script>
        // === 全局变量 ===
        let chart, candlestickSeries;
        let orderMode = 'normal'; // normal, conditional, trailing
        let priceOffset = 0;
        let callbackRate = 1;
        let currentAmount = 10;
        let amountPresets = [10, 100, 500, 1000]; // 可自定义的金额快选
        let currentPrice = 0;
        let orders = [];
        let positions = [];
        let orderIdCounter = 1;
        let positionIdCounter = 1;
        let currentExchange = 'hyperliquid';
        let wsConnection = null;
        
        // K线图上的价格线
        let priceLinesMap = new Map(); // key: orderId/positionId, value: priceLine object
        
        // API配置
        const API_CONFIG = {
            hyperliquid: {
                name: 'Hyperliquid',
                rest: 'https://api.hyperliquid.xyz/info',
                ws: 'wss://api.hyperliquid.xyz/ws',
                coin: 'BTC'
            },
            binance: {
                name: '币安',
                kline: 'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1m&limit=500',
                price: 'https://fapi.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT',
                ws: 'wss://fstream.binance.com/ws/btcusdt@kline_1m'
            }
        };

        // === 初始化 ===
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            loadKlineData();
            bindEvents();
            updateModeUI();
            addLog('系统初始化完成', 'info');
            addLog('🖱️ 左键=买入，右键=卖出', 'info');
        });

        // === 初始化图表 ===
        function initChart() {
            chart = LightweightCharts.createChart(document.getElementById('chart'), {
                width: document.getElementById('chart').clientWidth,
                height: document.getElementById('chart').clientHeight,
                layout: {
                    background: { color: '#1a1a1a' },
                    textColor: '#d3d3d3',
                },
                grid: {
                    vertLines: { color: '#2a2e39' },
                    horzLines: { color: '#2a2e39' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#363c4e',
                },
                timeScale: {
                    borderColor: '#363c4e',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // 图表点击事件 - 使用原生DOM事件以支持左右键区分
            const chartDiv = document.getElementById('chart');
            
            // 左键点击 = 买入
            chartDiv.addEventListener('click', (e) => {
                if (e.button !== 0) return; // 只处理左键
                const rect = chartDiv.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const price = candlestickSeries.coordinateToPrice(y);
                if (price && price > 0) {
                    handleChartClick(price, false);
                }
            });
            
            // 右键点击 = 卖出
            chartDiv.addEventListener('contextmenu', (e) => {
                e.preventDefault(); // 阻止右键菜单
                e.stopPropagation();
                const rect = chartDiv.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const price = candlestickSeries.coordinateToPrice(y);
                if (price && price > 0) {
                    handleChartClick(price, true);
                }
            });

            // 窗口大小调整
            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: document.getElementById('chart').clientWidth,
                    height: document.getElementById('chart').clientHeight,
                });
                updatePriceLineLabels();
            });
            
            // 时间轴变化时更新标签位置
            chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
                updatePriceLineLabels();
            });
        }

        // === 加载K线数据 ===
        async function loadKlineData() {
            try {
                const config = API_CONFIG[currentExchange];
                addLog(`正在从${config.name}加载K线数据...`, 'info');
                
                let klineData;
                
                if (currentExchange === 'hyperliquid') {
                    // Hyperliquid REST API
                    const now = Date.now();
                    const startTime = now - (500 * 60 * 1000); // 500分钟前
                    
                    const payload = {
                        type: 'candleSnapshot',
                        req: {
                            coin: config.coin,
                            interval: '1m',
                            startTime: startTime,
                            endTime: now
                        }
                    };
                    
                    const response = await fetch(config.rest, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    // Hyperliquid 返回格式: [{t: timestamp_ms, o: "67234.0", ...}]
                    klineData = data.map(item => ({
                        time: parseInt(item.t) / 1000,
                        open: parseFloat(item.o),
                        high: parseFloat(item.h),
                        low: parseFloat(item.l),
                        close: parseFloat(item.c),
                    }));
                } else if (currentExchange === 'binance') {
                    const response = await fetch(config.kline);
                    const data = await response.json();
                    
                    klineData = data.map(item => ({
                        time: parseInt(item[0]) / 1000,
                        open: parseFloat(item[1]),
                        high: parseFloat(item[2]),
                        low: parseFloat(item[3]),
                        close: parseFloat(item[4]),
                    }));
                }

                candlestickSeries.setData(klineData);
                
                // 更新当前价格
                const lastCandle = klineData[klineData.length - 1];
                currentPrice = lastCandle.close;
                document.getElementById('currentPrice').textContent = currentPrice.toFixed(2);
                
                addLog(`${config.name} K线数据加载成功`, 'success');
                
                // 启动实时更新
                startRealtimeUpdates();
                
            } catch (error) {
                addLog('K线数据加载失败: ' + error.message, 'error');
                console.error('K线数据加载错误:', error);
            }
        }
        
        // === 启动实时更新 ===
        function startRealtimeUpdates() {
            // 关闭现有连接
            if (wsConnection) {
                wsConnection.close();
                wsConnection = null;
            }
            
            const config = API_CONFIG[currentExchange];
            
            if (currentExchange === 'hyperliquid') {
                connectHyperliquidWS();
            } else if (currentExchange === 'binance') {
                connectBinanceWS();
            }
        }
        
        // === 币安WebSocket连接 ===
        function connectBinanceWS() {
            try {
                wsConnection = new WebSocket(API_CONFIG.binance.ws);
                
                wsConnection.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.k) {
                        const candle = {
                            time: parseInt(data.k.t) / 1000,
                            open: parseFloat(data.k.o),
                            high: parseFloat(data.k.h),
                            low: parseFloat(data.k.l),
                            close: parseFloat(data.k.c),
                        };
                        
                        candlestickSeries.update(candle);
                        currentPrice = candle.close;
                        document.getElementById('currentPrice').textContent = currentPrice.toFixed(2);
                        
                        // 更新仓位PnL
                        updatePositionsList();
                        
                        // 更新K线图上的标签
                        updatePriceLineLabels();
                        
                        // 检查订单触发
                        checkOrderTriggers();
                    }
                };
                
                wsConnection.onerror = (error) => {
                    console.error('WebSocket错误:', error);
                    addLog('WebSocket连接异常，切换到轮询模式', 'error');
                    setInterval(updatePricePolling, 3000);
                };
                
                addLog('WebSocket连接成功，实时更新已启动', 'success');
            } catch (error) {
                console.error('WebSocket连接失败:', error);
                setInterval(updatePricePolling, 3000);
            }
        }
        
        // === Hyperliquid WebSocket连接 ===
        function connectHyperliquidWS() {
            try {
                wsConnection = new WebSocket(API_CONFIG.hyperliquid.ws);
                
                wsConnection.onopen = () => {
                    console.log('✅ Hyperliquid WebSocket 已连接');
                    
                    // 订阅K线数据
                    wsConnection.send(JSON.stringify({
                        method: 'subscribe',
                        subscription: {
                            type: 'candle',
                            coin: API_CONFIG.hyperliquid.coin,
                            interval: '1m'
                        }
                    }));
                    
                    // 订阅实时价格（allMids）
                    wsConnection.send(JSON.stringify({
                        method: 'subscribe',
                        subscription: {
                            type: 'allMids'
                        }
                    }));
                    
                    addLog('Hyperliquid WebSocket连接成功', 'success');
                };
                
                wsConnection.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        // K线更新
                        if (data.channel === 'candle' && data.data) {
                            const item = data.data;
                            const candle = {
                                time: parseInt(item.t) / 1000,
                                open: parseFloat(item.o),
                                high: parseFloat(item.h),
                                low: parseFloat(item.l),
                                close: parseFloat(item.c),
                            };
                            
                            candlestickSeries.update(candle);
                            currentPrice = candle.close;
                            document.getElementById('currentPrice').textContent = currentPrice.toFixed(2);
                            
                            updatePositionsList();
                            updatePriceLineLabels();
                            checkOrderTriggers();
                        }
                        
                        // 实时价格更新（allMids）
                        else if (data.channel === 'allMids' && data.data) {
                            const mids = data.data.mids;
                            if (mids && mids[API_CONFIG.hyperliquid.coin]) {
                                const price = parseFloat(mids[API_CONFIG.hyperliquid.coin]);
                                if (price > 0) {
                                    currentPrice = price;
                                    document.getElementById('currentPrice').textContent = currentPrice.toFixed(2);
                                    updatePositionsList();
                                    updatePriceLineLabels();
                                    checkOrderTriggers();
                                }
                            }
                        }
                    } catch (error) {
                        console.error('Hyperliquid WebSocket 消息处理错误:', error);
                    }
                };
                
                wsConnection.onerror = (error) => {
                    console.error('Hyperliquid WebSocket错误:', error);
                    addLog('WebSocket连接异常', 'error');
                };
                
                wsConnection.onclose = () => {
                    console.log('Hyperliquid WebSocket 连接关闭，5秒后重连...');
                    addLog('连接断开，正在重连...', 'info');
                    setTimeout(connectHyperliquidWS, 5000);
                };
            } catch (error) {
                console.error('Hyperliquid WebSocket连接失败:', error);
                addLog('WebSocket连接失败', 'error');
            }
        }

        // === 切换交易所 ===
        function switchExchange() {
            const selector = document.getElementById('exchangeSelector');
            currentExchange = selector.value;
            
            addLog(`切换到${API_CONFIG[currentExchange].name}`, 'info');
            
            // 重新加载数据
            loadKlineData();
        }

        // === 切换下单模式 ===
        function cycleMode() {
            const modes = ['normal', 'conditional', 'trailing'];
            const currentIndex = modes.indexOf(orderMode);
            orderMode = modes[(currentIndex + 1) % modes.length];
            updateModeUI();
            
            const modeNames = {
                'normal': '普通模式',
                'conditional': '条件单模式',
                'trailing': '跟踪止损模式'
            };
            addLog(`切换到 ${modeNames[orderMode]}`, 'info');
        }

        // === 更新模式UI ===
        function updateModeUI() {
            const btn = document.getElementById('modeBtn');
            const offsetControl = document.getElementById('offsetControl');
            const callbackControl = document.getElementById('callbackControl');
            
            // 重置所有样式
            btn.className = 'mode-btn';
            offsetControl.classList.remove('active');
            callbackControl.classList.remove('active');
            
            switch(orderMode) {
                case 'normal':
                    btn.classList.add('mode-normal');
                    btn.textContent = '普通';
                    break;
                case 'conditional':
                    btn.classList.add('mode-conditional');
                    btn.textContent = '条件单';
                    offsetControl.classList.add('active');
                    break;
                case 'trailing':
                    btn.classList.add('mode-trailing');
                    btn.textContent = '追踪止损';
                    callbackControl.classList.add('active');
                    break;
            }
        }

        // === 处理K线点击（左键=买入，右键=卖出）===
        function handleChartClick(clickPrice, isRightClick = false) {
            const price = parseFloat(clickPrice.toFixed(2));
            // 左键=买入，右键=卖出
            const side = isRightClick ? 'SELL' : 'BUY';
            const sideText = side === 'BUY' ? '买入' : '卖出';
            
            let order = {
                id: orderIdCounter++,
                side: side,
                price: price,
                amount: currentAmount,
                mode: orderMode,
                status: 'pending',
                time: new Date().toLocaleTimeString()
            };
            
            // 根据模式添加特定参数
            switch(orderMode) {
                case 'normal':
                    // 普通模式：检查是否直接成交
                    if (side === 'BUY' && price >= currentPrice) {
                        order.status = 'filled';
                        addLog(`✅ ${sideText}单直接成交 @ ${price} (数量: ${currentAmount}U)`, 'success');
                        createPosition(side, price, currentAmount);
                    } else if (side === 'SELL' && price <= currentPrice) {
                        order.status = 'filled';
                        addLog(`✅ ${sideText}单直接成交 @ ${price} (数量: ${currentAmount}U)`, 'success');
                        createPosition(side, price, currentAmount);
                    } else {
                        addLog(`📝 ${sideText}挂单 @ ${price} (数量: ${currentAmount}U)`, 'info');
                        // 在K线图上绘制挂单价格线
                        drawOrderLine(order);
                    }
                    break;
                    
                case 'conditional':
                    priceOffset = parseFloat(document.getElementById('offsetInput').value) || 0;
                    order.priceOffset = priceOffset;
                    
                    // 条件单模式逻辑：
                    // 触发价 = 点击价格（固定）
                    // 下单价 = 触发价 × (1 ± offset%)
                    // 买入：点击价 < 当前价 = 限价挂单，点击价 > 当前价 = 条件单（突破买入）
                    // 卖出：点击价 > 当前价 = 限价挂单，点击价 < 当前价 = 条件单（跌破卖出）
                    
                    order.stopPrice = price; // 触发价（点击价）
                    
                    if (side === 'BUY') {
                        if (price < currentPrice) {
                            // 买入限价挂单
                            order.orderType = 'LIMIT';
                            order.limitPrice = price;
                            addLog(`📝 ${sideText}限价挂单 @ ${price} (数量: ${currentAmount}U)`, 'info');
                        } else {
                            // 买入条件单（突破买入）
                            order.orderType = 'STOP';
                            order.limitPrice = price * (1 + priceOffset / 100); // 触发后的下单价
                            addLog(`📝 条件单 ${sideText} (触发: ${price}, 下单: ${order.limitPrice.toFixed(2)}, Offset: ${priceOffset}%)`, 'info');
                        }
                    } else {
                        if (price > currentPrice) {
                            // 卖出限价挂单
                            order.orderType = 'LIMIT';
                            order.limitPrice = price;
                            addLog(`📝 ${sideText}限价挂单 @ ${price} (数量: ${currentAmount}U)`, 'info');
                        } else {
                            // 卖出条件单（跌破卖出）
                            order.orderType = 'STOP';
                            order.limitPrice = price * (1 - priceOffset / 100); // 触发后的下单价
                            addLog(`📝 条件单 ${sideText} (触发: ${price}, 下单: ${order.limitPrice.toFixed(2)}, Offset: ${priceOffset}%)`, 'info');
                        }
                    }
                    
                    drawOrderLine(order);
                    break;
                    
                case 'trailing':
                    callbackRate = parseFloat(document.getElementById('callbackSelect').value) || 1;
                    order.callbackRate = callbackRate;
                    order.activationPrice = price; // 激活价（点击价）
                    order.activated = false; // 追踪是否已激活
                    
                    // 根据激活价和当前价的关系判断是否立即激活
                    if (side === 'BUY') {
                        // 买入追踪：激活价 >= 当前价则立即激活
                        if (price >= currentPrice) {
                            order.activated = true;
                            order.lowestPrice = currentPrice; // 从当前价开始追踪
                            addLog(`📝 追踪止损 ${sideText} (立即激活, 回撤: ${callbackRate}%)`, 'info');
                        } else {
                            order.lowestPrice = price; // 从激活价开始追踪
                            addLog(`📝 追踪止损 ${sideText} (激活价: ${price}, 回撤: ${callbackRate}%)`, 'info');
                        }
                    } else {
                        // 卖出追踪：激活价 <= 当前价则立即激活
                        if (price <= currentPrice) {
                            order.activated = true;
                            order.highestPrice = currentPrice; // 从当前价开始追踪
                            addLog(`📝 追踪止损 ${sideText} (立即激活, 回撤: ${callbackRate}%)`, 'info');
                        } else {
                            order.highestPrice = price; // 从激活价开始追踪
                            addLog(`📝 追踪止损 ${sideText} (激活价: ${price}, 回撤: ${callbackRate}%)`, 'info');
                        }
                    }
                    
                    drawOrderLine(order);
                    break;
            }
            
            orders.push(order);
            updateOrdersList();
        }
        
        // === 创建仓位 ===
        function createPosition(side, price, amount) {
            const position = {
                id: positionIdCounter++,
                side: side,
                entryPrice: price,
                amount: amount,
                quantity: amount / price,
                time: new Date().toLocaleTimeString(),
                pnl: 0
            };
            
            positions.push(position);
            updatePositionsList();
            drawPositionLine(position);
            
            const sideText = side === 'BUY' ? '做多' : '做空';
            addLog(`📊 开仓成功: ${sideText} @ ${price.toFixed(2)} (数量: ${amount}U)`, 'success');
        }
        
        // === 平仓功能 ===
        function closePosition(positionId) {
            const posIndex = positions.findIndex(p => p.id === positionId);
            if (posIndex === -1) return;
            
            const position = positions[posIndex];
            const sideText = position.side === 'BUY' ? '做多' : '做空';
            const pnl = position.pnl;
            
            // 移除K线图上的价格线
            removePriceLine('position-' + positionId);
            
            // 移除仓位
            positions.splice(posIndex, 1);
            updatePositionsList();
            
            addLog(`✅ 平仓成功: ${sideText} PnL: ${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}U`, pnl >= 0 ? 'success' : 'error');
        }
        
        // === 更新仓位列表 ===
        function updatePositionsList() {
            const container = document.getElementById('positionsList');
            
            if (positions.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无持仓</div>';
                return;
            }
            
            container.innerHTML = positions.map(pos => {
                const posClass = pos.side === 'BUY' ? 'position-long' : 'position-short';
                const sideText = pos.side === 'BUY' ? '做多' : '做空';
                
                // 计算实时PnL
                let pnl;
                if (pos.side === 'BUY') {
                    pnl = (currentPrice - pos.entryPrice) * pos.quantity;
                } else {
                    pnl = (pos.entryPrice - currentPrice) * pos.quantity;
                }
                pos.pnl = pnl;
                
                const pnlColor = pnl >= 0 ? '#26a69a' : '#ef5350';
                
                return `
                    <div class="position-item ${posClass}">
                        <div class="position-header">
                            <span>${sideText} @ ${pos.entryPrice.toFixed(2)}</span>
                            <span style="display: flex; align-items: center;">
                                <span class="position-pnl" style="color: ${pnlColor}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}U</span>
                                <button class="close-btn" onclick="closePosition(${pos.id})">平仓</button>
                            </span>
                        </div>
                        <div class="position-details">${pos.time} | 数量: ${pos.quantity.toFixed(6)} BTC</div>
                    </div>
                `;
            }).join('');
        }

        // === 更新挂单列表 ===
        function updateOrdersList() {
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无挂单<br/>左键=买入，右键=卖出</div>';
                return;
            }
            
            container.innerHTML = orders.map(order => {
                const sideClass = order.side === 'BUY' ? 'order-buy' : 'order-sell';
                const sideText = order.side === 'BUY' ? '买入' : '卖出';
                const statusText = order.status === 'filled' ? '已成交' : 
                                 order.status === 'cancelled' ? '已撤单' : '等待触发';
                const statusColor = order.status === 'filled' ? '#26a69a' : 
                                  order.status === 'cancelled' ? '#666' : '#ffa726';
                
                let details = `${order.time} | ${order.amount}U`;
                
                if (order.mode === 'conditional') {
                    if (order.orderType === 'STOP' && order.stopPrice) {
                        details += ` | 触发: ${order.stopPrice.toFixed(2)} → 下单: ${order.limitPrice.toFixed(2)}`;
                    } else if (order.orderType === 'LIMIT') {
                        details += ` | 限价`;
                    }
                } else if (order.mode === 'trailing') {
                    const activatedText = order.activated ? '已激活' : '等待激活';
                    details += ` | 回撤: ${order.callbackRate}% | ${activatedText}`;
                }
                
                // 只有pending状态的订单才显示撤单按钮
                const cancelBtn = order.status === 'pending' ? 
                    `<button onclick="cancelOrder(${order.id})" style="background: #ef5350; color: white; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; margin-left: 8px;">撤单</button>` : '';
                
                return `
                    <div class="order-item ${sideClass}" id="order-${order.id}" style="${order.status === 'cancelled' ? 'opacity: 0.5;' : ''}">
                        <div class="order-header">
                            <span>${sideText} @ ${order.price.toFixed(2)}</span>
                            <span style="display: flex; align-items: center;">
                                <span style="color: ${statusColor}">${statusText}</span>
                                ${cancelBtn}
                            </span>
                        </div>
                        <div class="order-details">${details}</div>
                    </div>
                `;
            }).join('');
        }
        
        // === 撤单功能 ===
        function cancelOrder(orderId) {
            const orderIndex = orders.findIndex(o => o.id === orderId);
            if (orderIndex === -1) return;
            
            const order = orders[orderIndex];
            if (order.status !== 'pending') {
                addLog('只能撤销等待中的订单', 'error');
                return;
            }
            
            order.status = 'cancelled';
            
            // 移除K线图上的价格线
            removePriceLine('order-' + orderId);
            
            updateOrdersList();
            
            const sideText = order.side === 'BUY' ? '买入' : '卖出';
            addLog(`🗑️ 已撤单: ${sideText} @ ${order.price.toFixed(2)}`, 'info');
        }
        
        // === 在K线图上绘制订单价格线 ===
        function drawOrderLine(order) {
            const lineKey = 'order-' + order.id;
            // 显示价格：条件单显示触发价(stopPrice)，追踪显示激活价，其他显示下单价
            let displayPrice;
            if (order.mode === 'conditional' && order.orderType === 'STOP') {
                displayPrice = order.stopPrice; // 条件单显示触发价
            } else if (order.activationPrice) {
                displayPrice = order.activationPrice; // 追踪显示激活价
            } else {
                displayPrice = order.limitPrice || order.price; // 普通/限价显示下单价
            }
            
            const priceLine = candlestickSeries.createPriceLine({
                price: displayPrice,
                color: order.side === 'BUY' ? '#26a69a' : '#ef5350',
                lineWidth: 2,
                lineStyle: 2, // 虚线
                axisLabelVisible: false, // 隐藏右侧标签，使用自定义左侧标签
                title: '',
            });
            
            priceLinesMap.set(lineKey, {priceLine, type: 'order', data: order});
            updatePriceLineLabels();
        }
        
        // === 在K线图上绘制仓位价格线 ===
        function drawPositionLine(position) {
            const lineKey = 'position-' + position.id;
            
            const priceLine = candlestickSeries.createPriceLine({
                price: position.entryPrice,
                color: position.side === 'BUY' ? '#00d4aa' : '#ff9800',
                lineWidth: 3,
                lineStyle: 0, // 实线
                axisLabelVisible: false, // 隐藏右侧标签，使用自定义左侧标签
                title: '',
            });
            
            priceLinesMap.set(lineKey, {priceLine, type: 'position', data: position});
            updatePriceLineLabels();
        }
        
        // === 移除价格线 ===
        function removePriceLine(lineKey) {
            const item = priceLinesMap.get(lineKey);
            if (item && item.priceLine) {
                candlestickSeries.removePriceLine(item.priceLine);
                priceLinesMap.delete(lineKey);
                updatePriceLineLabels();
            }
        }
        
        // === 更新价格线标签（左侧显示，带操作按钮，支持拖动）===
        function updatePriceLineLabels() {
            const container = document.getElementById('priceLineLabels');
            if (!container) return;
            
            container.innerHTML = '';
            
            priceLinesMap.forEach((item, key) => {
                const data = item.data;
                const type = item.type;
                
                let price, labelText, actionBtn, labelClass;
                
                if (type === 'order') {
                    // 确定显示价格
                    if (data.mode === 'conditional' && data.orderType === 'STOP') {
                        price = data.stopPrice; // 条件单显示触发价
                    } else if (data.activationPrice) {
                        price = data.activationPrice; // 追踪显示激活价
                    } else {
                        price = data.limitPrice || data.price; // 普通/限价显示下单价
                    }
                    
                    // 显示订单类型标识
                    let modeTag = '';
                    if (data.mode === 'conditional' && data.orderType === 'STOP') {
                        // 条件单显示触发价和下单价
                        modeTag = '[条件] ';
                        const limitPriceText = data.limitPrice ? `→${data.limitPrice.toFixed(2)}` : '';
                        labelText = `${modeTag}${data.side === 'BUY' ? '买' : '卖'} ${price.toFixed(2)}${limitPriceText}`;
                    } else if (data.mode === 'trailing') {
                        // 追踪止损显示激活状态
                        const statusTag = data.activated ? '✓' : '○';
                        modeTag = `[追踪${statusTag}] `;
                        labelText = `${modeTag}${data.side === 'BUY' ? '买' : '卖'} ${price.toFixed(2)}`;
                    } else {
                        // 普通模式或限价单
                        labelText = `${data.side === 'BUY' ? '买' : '卖'} ${price.toFixed(2)}`;
                    }
                    
                    actionBtn = `<button onclick="event.stopPropagation(); cancelOrder(${data.id})">撤单</button>`;
                    labelClass = data.side === 'BUY' ? 'order-buy' : 'order-sell';
                } else {
                    price = data.entryPrice;
                    const pnl = data.pnl || 0;
                    const pnlText = `${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}`;
                    labelText = `${data.side === 'BUY' ? '多' : '空'} ${price.toFixed(2)} (${pnlText})`;
                    actionBtn = `<button onclick="event.stopPropagation(); closePosition(${data.id})">平仓</button>`;
                    labelClass = data.side === 'BUY' ? 'position-long' : 'position-short';
                }
                
                // 计算Y坐标
                const yCoord = candlestickSeries.priceToCoordinate(price);
                if (yCoord === null) return;
                
                const label = document.createElement('div');
                label.className = `price-line-label ${labelClass}`;
                label.style.top = (yCoord - 15) + 'px';
                label.innerHTML = `<span>${labelText}</span>${actionBtn}`;
                label.dataset.key = key;
                label.dataset.type = type;
                
                // 只有挂单才可以拖动（仓位不允许拖动改价）
                if (type === 'order') {
                    label.title = '拖动可改单';
                    enableDragToModify(label, key, data);
                }
                
                container.appendChild(label);
            });
        }
        
        // === 启用拖动改单功能 ===
        function enableDragToModify(labelElement, lineKey, orderData) {
            let isDragging = false;
            let startY = 0;
            let startPrice = 0;
            
            labelElement.addEventListener('mousedown', function(e) {
                // 如果点击的是按钮，不触发拖动
                if (e.target.tagName === 'BUTTON') return;
                
                isDragging = true;
                startY = e.clientY;
                
                // 记录拖动开始时的价格
                if (orderData.mode === 'conditional' && orderData.orderType === 'STOP') {
                    startPrice = orderData.stopPrice;
                } else if (orderData.activationPrice) {
                    startPrice = orderData.activationPrice;
                } else {
                    startPrice = orderData.limitPrice || orderData.price;
                }
                
                labelElement.classList.add('dragging');
                e.preventDefault();
                
                const onMouseMove = (e) => {
                    if (!isDragging) return;
                    
                    const chartDiv = document.getElementById('chart');
                    const rect = chartDiv.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    
                    // 转换Y坐标为价格
                    const newPrice = candlestickSeries.coordinateToPrice(y);
                    if (!newPrice || newPrice <= 0) return;
                    
                    // 更新订单价格和价格线
                    updateOrderPrice(orderData, newPrice, lineKey);
                };
                
                const onMouseUp = () => {
                    if (isDragging) {
                        isDragging = false;
                        labelElement.classList.remove('dragging');
                        
                        const sideText = orderData.side === 'BUY' ? '买入' : '卖出';
                        let newPrice;
                        if (orderData.mode === 'conditional' && orderData.orderType === 'STOP') {
                            newPrice = orderData.stopPrice;
                        } else if (orderData.activationPrice) {
                            newPrice = orderData.activationPrice;
                        } else {
                            newPrice = orderData.limitPrice || orderData.price;
                        }
                        
                        addLog(`📝 改单: ${sideText} ${startPrice.toFixed(2)} → ${newPrice.toFixed(2)}`, 'info');
                        
                        updateOrdersList();
                    }
                    
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }
        
        // === 更新订单价格（根据模式不同逻辑不同）===
        function updateOrderPrice(order, newPrice, lineKey) {
            const item = priceLinesMap.get(lineKey);
            if (!item || !item.priceLine) return;
            
            switch(order.mode) {
                case 'normal':
                    // 普通模式：直接改价格
                    order.price = newPrice;
                    item.priceLine.applyOptions({ price: newPrice });
                    break;
                    
                case 'conditional':
                    // 条件单模式：改触发价或限价
                    if (order.orderType === 'STOP') {
                        // 条件单：改触发价，同时重新计算下单价
                        order.stopPrice = newPrice;
                        order.price = newPrice;
                        const offset = order.priceOffset || 0;
                        order.limitPrice = order.side === 'BUY' 
                            ? newPrice * (1 + offset / 100)
                            : newPrice * (1 - offset / 100);
                        item.priceLine.applyOptions({ price: newPrice });
                    } else {
                        // 限价单：直接改价格
                        order.limitPrice = newPrice;
                        order.price = newPrice;
                        item.priceLine.applyOptions({ price: newPrice });
                    }
                    break;
                    
                case 'trailing':
                    // 追踪止损模式：改激活价，重置追踪状态
                    order.activationPrice = newPrice;
                    order.price = newPrice;
                    order.activated = false; // 重置激活状态
                    
                    // 重新判断是否立即激活
                    if (order.side === 'BUY') {
                        if (newPrice >= currentPrice) {
                            order.activated = true;
                            order.lowestPrice = currentPrice;
                        } else {
                            order.lowestPrice = newPrice;
                        }
                    } else {
                        if (newPrice <= currentPrice) {
                            order.activated = true;
                            order.highestPrice = currentPrice;
                        } else {
                            order.highestPrice = newPrice;
                        }
                    }
                    
                    item.priceLine.applyOptions({ price: newPrice });
                    break;
            }
            
            // 更新标签位置和文字
            updatePriceLineLabels();
        }

        // === 检查订单触发 ===
        function checkOrderTriggers() {
            let triggered = false;
            
            orders.forEach(order => {
                if (order.status !== 'pending') return;
                
                switch(order.mode) {
                    case 'normal':
                        // 普通挂单：价格到达即成交
                        if ((order.side === 'BUY' && currentPrice <= order.price) ||
                            (order.side === 'SELL' && currentPrice >= order.price)) {
                            order.status = 'filled';
                            triggered = true;
                            removePriceLine('order-' + order.id);
                            createPosition(order.side, order.price, order.amount);
                            addLog(`✅ ${order.side === 'BUY' ? '买入' : '卖出'}单成交 @ ${order.price}`, 'success');
                        }
                        break;
                        
                    case 'conditional':
                        // 条件单模式：区分限价单和条件单
                        if (order.orderType === 'LIMIT') {
                            // 限价单：价格到达即成交
                            if ((order.side === 'BUY' && currentPrice <= order.limitPrice) ||
                                (order.side === 'SELL' && currentPrice >= order.limitPrice)) {
                                order.status = 'filled';
                                triggered = true;
                                removePriceLine('order-' + order.id);
                                createPosition(order.side, order.limitPrice, order.amount);
                                addLog(`✅ 限价${order.side === 'BUY' ? '买入' : '卖出'}单成交 @ ${order.limitPrice.toFixed(2)}`, 'success');
                            }
                        } else {
                            // 条件单（STOP）：触发价到达后，以下单价成交
                            if ((order.side === 'BUY' && currentPrice >= order.stopPrice) ||
                                (order.side === 'SELL' && currentPrice <= order.stopPrice)) {
                                order.status = 'filled';
                                triggered = true;
                                removePriceLine('order-' + order.id);
                                createPosition(order.side, order.limitPrice, order.amount);
                                addLog(`✅ 条件单触发并成交 (触发: ${order.stopPrice.toFixed(2)}, 成交: ${order.limitPrice.toFixed(2)})`, 'success');
                            }
                        }
                        break;
                        
                    case 'trailing':
                        // 追踪止损：分两个阶段 - 等待激活 + 追踪触发
                        if (order.side === 'BUY') {
                            // 买入追踪止损
                            if (!order.activated) {
                                // 阶段1：等待价格跌到激活价
                                if (currentPrice <= order.activationPrice) {
                                    order.activated = true;
                                    order.lowestPrice = currentPrice;
                                    // 不需要日志，静默激活
                                }
                            } else {
                                // 阶段2：已激活，追踪最低价
                                order.lowestPrice = Math.min(order.lowestPrice, currentPrice);
                                const triggerPrice = order.lowestPrice * (1 + order.callbackRate / 100);
                                if (currentPrice >= triggerPrice) {
                                    order.status = 'filled';
                                    triggered = true;
                                    removePriceLine('order-' + order.id);
                                    createPosition(order.side, currentPrice, order.amount);
                                    addLog(`✅ 追踪止损买入触发 (最低: ${order.lowestPrice.toFixed(2)}, 成交: ${currentPrice.toFixed(2)})`, 'success');
                                }
                            }
                        } else {
                            // 卖出追踪止损
                            if (!order.activated) {
                                // 阶段1：等待价格涨到激活价
                                if (currentPrice >= order.activationPrice) {
                                    order.activated = true;
                                    order.highestPrice = currentPrice;
                                    // 不需要日志，静默激活
                                }
                            } else {
                                // 阶段2：已激活，追踪最高价
                                order.highestPrice = Math.max(order.highestPrice, currentPrice);
                                const triggerPrice = order.highestPrice * (1 - order.callbackRate / 100);
                                if (currentPrice <= triggerPrice) {
                                    order.status = 'filled';
                                    triggered = true;
                                    removePriceLine('order-' + order.id);
                                    createPosition(order.side, currentPrice, order.amount);
                                    addLog(`✅ 追踪止损卖出触发 (最高: ${order.highestPrice.toFixed(2)}, 成交: ${currentPrice.toFixed(2)})`, 'success');
                                }
                            }
                        }
                        break;
                }
            });
            
            if (triggered) {
                updateOrdersList();
            }
        }

        // === 添加日志 ===
        function addLog(message, type = 'info') {
            const container = document.getElementById('logsList');
            const logClass = `log-${type}`;
            const time = new Date().toLocaleTimeString();
            
            const logItem = document.createElement('div');
            logItem.className = `log-item ${logClass}`;
            logItem.textContent = `[${time}] ${message}`;
            
            container.insertBefore(logItem, container.firstChild);
            
            // 保留最新20条日志
            while (container.children.length > 20) {
                container.removeChild(container.lastChild);
            }
        }

        // === 绑定事件 ===
        function bindEvents() {
            // 金额按钮
            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    currentAmount = amountPresets[index];
                    addLog(`金额设置为 ${currentAmount}U`, 'info');
                });
            });
            
            // 交易所选择器
            document.getElementById('exchangeSelector').addEventListener('change', switchExchange);
            
            // 从localStorage加载金额配置
            loadAmountPresets();
        }
        
        // === 加载金额配置 ===
        function loadAmountPresets() {
            const saved = localStorage.getItem('kline_amount_presets');
            if (saved) {
                try {
                    amountPresets = JSON.parse(saved);
                    updateAmountButtons();
                    addLog('已加载自定义金额配置', 'info');
                } catch (e) {
                    console.error('加载金额配置失败:', e);
                }
            }
        }
        
        // === 更新金额按钮显示 ===
        function updateAmountButtons() {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`amountBtn${i}`);
                if (btn) {
                    btn.textContent = amountPresets[i] + 'U';
                }
            }
        }
        
        // === 配置金额 ===
        function configAmounts() {
            const input = prompt(
                `设置金额快选（用逗号分隔，例如: 10,50,200,1000）\n\n当前配置:\n${amountPresets.join(', ')}`,
                amountPresets.join(',')
            );
            
            if (input === null) return; // 用户取消
            
            try {
                const values = input.split(',').map(v => parseInt(v.trim())).filter(v => v > 0);
                
                if (values.length !== 4) {
                    addLog('❌ 请输入4个金额值', 'error');
                    return;
                }
                
                amountPresets = values;
                updateAmountButtons();
                
                // 保存到localStorage
                localStorage.setItem('kline_amount_presets', JSON.stringify(amountPresets));
                
                addLog(`✅ 金额配置已更新: ${amountPresets.join(', ')}`, 'success');
            } catch (e) {
                addLog('❌ 配置格式错误', 'error');
            }
        }
    </script>
</body>
</html>
